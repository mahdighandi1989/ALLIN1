version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: allin1_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-allin1_db}
      POSTGRES_USER: ${POSTGRES_USER:-allin1_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-allin1_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - allin1_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-allin1_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: allin1_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-allin1_user}:${POSTGRES_PASSWORD:-allin1_password}@db:5432/${POSTGRES_DB:-allin1_db}
      # SECRET_KEY must be supplied via the environment / .env file. There is
      # intentionally NO weak hardcoded fallback — generate one with
      # `openssl rand -base64 48`. The app refuses to start with a weak key.
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set (openssl rand -base64 48)}
      - DEBUG=${DEBUG:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - allin1_network
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped

  # Frontend Service (Optional)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: allin1_frontend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NODE_ENV=${NODE_ENV:-development}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - allin1_network
    restart: unless-stopped

networks:
  allin1_network:
    driver: bridge

volumes:
  postgres_data: