version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: banking-ops-db
    environment:
      POSTGRES_USER: ${DB_USER:-banking_ops_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-$(openssl rand -base64 32)}
      POSTGRES_DB: ${DB_NAME:-banking_ops}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-banking_ops_user} -d ${DB_NAME:-banking_ops}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - banking-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: banking-ops-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-$(openssl rand -base64 32)}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-$(openssl rand -base64 32)}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - banking-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: banking-ops-api
    environment:
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-banking_ops_user}:${DB_PASSWORD:-$(openssl rand -base64 32)}@db:5432/${DB_NAME:-banking_ops}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-$(openssl rand -base64 32)}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-$(openssl rand -base64 64)}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-$(openssl rand -base64 64)}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    restart: unless-stopped
    networks:
      - banking-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: banking-ops-frontend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      - NODE_ENV=${NODE_ENV:-production}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
    networks:
      - banking-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local

networks:
  banking-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16