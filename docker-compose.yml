version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: allin1_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-allin1_db}
      POSTGRES_USER: ${POSTGRES_USER:-allin1_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-allin1_pass}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - allin1_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-allin1_user} -d ${POSTGRES_DB:-allin1_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Service
  backend:
    build:
      context: ./backend
      target: ${BUILD_TARGET:-development}
    container_name: allin1_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-allin1_user}:${POSTGRES_PASSWORD:-allin1_pass}@db:5432/${POSTGRES_DB:-allin1_db}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - DEBUG=${DEBUG:-true}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app:${VOLUME_MODE:-rw}
      - backend_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - allin1_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      target: ${BUILD_TARGET:-development}
    container_name: allin1_frontend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NODE_ENV=${NODE_ENV:-development}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app:${VOLUME_MODE:-rw}
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - allin1_network
    restart: unless-stopped

  # Redis (Optional - for caching)
  redis:
    image: redis:7-alpine
    container_name: allin1_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - allin1_network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local

networks:
  allin1_network:
    driver: bridge