server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the backend service — without this, the SPA fallback
    # returned index.html (HTTP 200) for every /api request in the
    # docker-compose deployment and the app "logged in" with an HTML string
    # as the user object.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing: try file, then directory, then fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable access to hidden files
    location ~ /\. {
        deny all;
    }
}
