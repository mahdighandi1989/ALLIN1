# Promote a supervisor run's finished work to main — after the SAME gate as CI.
#
# Why this exists (docs/AUDIT_LOG.md 2026-10-12): the scheduled supervisor runs
# sometimes cannot push to `main` themselves — the run's permission guard refuses
# a production deploy from a claude/* session, and the run's container cannot
# always install the pinned Python packages, so its local pytest is not a real
# gate either. The owner's standing instruction is that green work goes straight
# to main (CLAUDE.md). So a run that cannot push main pushes its commit to
# `supervisor-pending/<sheet>` instead, and this workflow:
#   1. runs exactly the checks of ci.yml (pytest on Python 3.11 with the pinned
#      requirements, frontend type-check + build),
#   2. ONLY if both are green, fast-forwards main to that commit (never a merge
#      commit, never a force-push — if main has moved on, it stops and the next
#      urgent run rebases and re-pushes the branch, which re-runs this),
#   3. deletes the pending branch.
# Render auto-deploys main as with any other push.

name: Supervisor pending → main

on:
  push:
    branches: ['supervisor-pending/**']

concurrency:
  group: supervisor-pending-promote
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-mock aiosqlite xlwt
      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

  frontend:
    name: Frontend type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run build

  promote:
    name: Fast-forward main
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward main to this commit (no merge, no force)
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main "$GITHUB_SHA"; then
            echo "::error::main has moved on since this branch was made — not a fast-forward."
            echo "The next urgent supervisor run rebases ${GITHUB_REF_NAME} on main and re-pushes it, which re-runs this workflow."
            exit 1
          fi
          git push origin "$GITHUB_SHA:refs/heads/main"
          echo "main → $GITHUB_SHA"
      - name: Remove the pending branch
        run: git push origin --delete "$GITHUB_REF_NAME" || echo "branch already gone"
