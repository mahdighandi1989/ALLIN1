# Development override
version: '3.8'

services:
  db:
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=allin1_dev
      - POSTGRES_USER=dev_user
      - POSTGRES_PASSWORD=dev_secure_pass_2024
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d allin1_dev"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      target: development
    environment:
      - DEBUG=true
      - DATABASE_ECHO=true
      - DATABASE_URL=postgresql+asyncpg://dev_user:dev_secure_pass_2024@db:5432/allin1_dev
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - SECRET_KEY=dev_secret_key_change_in_production_2024_secure_random
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
    volumes:
      - ./backend:/app:rw
      - backend_dev_logs:/app/logs
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--log-level", "debug"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      target: development
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app:rw
      - /app/node_modules
      - /app/.next
    command: ["npm", "run", "dev"]
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_dev_data:
  backend_dev_logs:

networks:
  default:
    name: allin1_dev_network