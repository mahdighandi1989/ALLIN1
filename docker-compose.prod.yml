# Production override
version: '3.8'

services:
  db:
    environment:
      - POSTGRES_HOST_AUTH_METHOD=md5
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - allin1_network

  backend:
    build:
      target: production
    environment:
      - DEBUG=false
      - DATABASE_ECHO=false
    volumes:
      - backend_prod_logs:/app/logs
    command: ["gunicorn", "app.main:app", "-w", "4", "-k", "uvicorn.workers.UvicornWorker", "--bind", "0.0.0.0:8000", "--access-logfile", "-", "--error-logfile", "-"]
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - allin1_network

  frontend:
    build:
      target: production
    environment:
      - NODE_ENV=production
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - allin1_network

  # Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: allin1_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - allin1_network
    restart: always

volumes:
  postgres_prod_data:
  backend_prod_logs:

networks:
  allin1_network:
    driver: bridge