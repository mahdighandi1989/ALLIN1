# Render Blueprint Configuration
# https://render.com/docs/blueprint-spec
# Single service that serves both API and Frontend

services:
  # Combined Backend API + Frontend Service
  - type: web
    name: banking-ops
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: |
      # Build frontend
      cd frontend && npm install && npm run build
      # Copy frontend build output to backend's static serving path
      cp -r out/ ../backend/static_frontend/ || true
      # Install backend dependencies
      cd ../backend && pip install --no-cache-dir --upgrade -r requirements.txt
    startCommand: |
      cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.7"
      - key: NODE_VERSION
        value: "20"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: banking-ops-db
          property: connectionString
      - key: CORS_ORIGINS
        value: ""
      - key: ENVIRONMENT
        value: "production"
    healthCheckPath: /health
    autoDeploy: true

databases:
  # PostgreSQL Database
  - name: banking-ops-db
    region: frankfurt
    plan: free
    databaseName: banking_ops
    user: banking_ops_user