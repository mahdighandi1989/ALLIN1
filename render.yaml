# Render Blueprint Configuration
# https://render.com/docs/blueprint-spec
# Single Python web service that serves the FastAPI API AND the pre-built
# frontend. The frontend is built in CI / committed under backend/static, so the
# deploy does NOT rebuild it on Render (that was slow and OOM/timeout-prone on
# small plans, and was the main cause of stuck deploys).

services:
  - type: web
    name: banking-ops
    runtime: python
    region: frankfurt
    plan: starter
    # Backend-only build: install Python deps from the backend directory.
    # No Node / npm / next build here — the static frontend is already committed
    # under backend/static and is served directly by FastAPI.
    buildCommand: "pip install --no-cache-dir --upgrade pip && pip install --no-cache-dir -r backend/requirements.txt"
    # Run DB migrations best-effort, then start the server. The app also
    # self-heals the schema and seeds demo data at startup (see app.db_init), so
    # a skipped/failed alembic step never blocks boot.
    startCommand: "cd backend && (alembic upgrade head || echo 'alembic skipped; schema self-heals at startup') && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.7"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: banking-ops-db
          property: connectionString
      - key: CORS_ORIGINS
        value: ""
      - key: ENVIRONMENT
        value: "production"
      # Login/auth is ENABLED: every request must carry a valid session. Google
      # Sign-In + username/password are both available. Set this to "true" only
      # to temporarily bypass login (every request becomes a shared demo admin).
      - key: AUTH_DISABLED
        value: "false"
      # ---- Google Sign-In (OAuth 2.0) ----
      # Values are managed in the Render dashboard (sync:false keeps them).
      #  • GOOGLE_REDIRECT_URI is OPTIONAL — when unset the backend derives
      #    "<service-url>/api/auth/google/callback" from the request. Register
      #    that exact URL as an Authorized redirect URI in the Google console.
      #  • ADMIN_EMAILS (comma/space separated) are always granted the admin role
      #    on Google sign-in; everyone else signs in as 'pending' until an admin
      #    grants them a role.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      # ---- Google Drive sync ----
      # Mirrors DB snapshots + attachments to Google Drive. Default mode "oauth"
      # syncs as a real user (reuses GOOGLE_CLIENT_ID/SECRET) and works with a
      # normal Gmail account — just set GOOGLE_DRIVE_ENABLED=true and click
      # "Connect Google Drive" in the panel. service_account mode needs a Workspace
      # Shared Drive (a Service Account has no personal storage quota). Values are
      # managed in the Render dashboard (sync:false).
      - key: GOOGLE_DRIVE_ENABLED
        sync: false
      - key: GOOGLE_DRIVE_AUTH_MODE
        sync: false
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
    healthCheckPath: /health
    autoDeploy: true

databases:
  - name: banking-ops-db
    region: frankfurt
    plan: basic-256mb
    databaseName: banking_ops
    user: banking_ops_user
