# Render Blueprint Configuration
# https://render.com/docs/blueprint-spec
# Single service that serves both API and Frontend

services:
  # Combined Backend API + Frontend Service
  - type: web
    name: banking-ops
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: |
      # Build frontend
      echo "Building frontend..."
      cd frontend && npm install && npm run build
      
      # Create static_frontend directory if it doesn't exist
      echo "Creating static_frontend directory..."
      mkdir -p ../backend/static_frontend
      
      # Copy frontend build output to backend's static serving path
      echo "Copying frontend files..."
      if [ -d "out" ]; then
        cp -r out/* ../backend/static_frontend/ || echo "Copy failed, continuing..."
      else
        echo "Frontend build directory 'out' not found!"
        # Create a basic index.html as fallback
        mkdir -p ../backend/static_frontend
        echo '<html><body><h1>ALLIN1 Banking System</h1><p>Frontend is being built...</p></body></html>' > ../backend/static_frontend/index.html
      fi
      
      # Install backend dependencies
      echo "Installing backend dependencies..."
      cd ../backend && pip install --no-cache-dir --upgrade -r requirements.txt
      
      echo "Build completed successfully!"
    startCommand: |
      cd backend && (alembic upgrade head || echo "Alembic migration skipped, tables will be created at startup") && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.7"
      - key: NODE_VERSION
        value: "20"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: banking-ops-db
          property: connectionString
      - key: CORS_ORIGINS
        value: ""
      - key: ENVIRONMENT
        value: "production"
      # Production keeps authentication ON. The app currently ships with
      # AUTH_DISABLED defaulting to true (login removed for now); this explicit
      # override ensures real deployments still require login.
      - key: AUTH_DISABLED
        value: "false"
    healthCheckPath: /health
    autoDeploy: true

databases:
  # PostgreSQL Database
  - name: banking-ops-db
    region: frankfurt
    plan: free
    databaseName: banking_ops
    user: banking_ops_user
