# Render Blueprint Configuration
# https://render.com/docs/blueprint-spec

services:
  # Backend API Service
  - type: web
    name: banking-ops-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.7"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: banking-ops-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://banking-ops-frontend.onrender.com,http://localhost:3000"
    healthCheckPath: /health
    autoDeploy: true

  # Frontend (Next.js)
  - type: web
    name: banking-ops-frontend
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "https://banking-ops-api.onrender.com"
    healthCheckPath: /
    autoDeploy: true

databases:
  # PostgreSQL Database
  - name: banking-ops-db
    region: frankfurt
    plan: free
    databaseName: banking_ops
    user: banking_ops_user
